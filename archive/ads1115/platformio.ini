[common]
platform = espressif32
board = upesy_wroom
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    adafruit/Adafruit ADS1X15@^2.5.0
    adafruit/Adafruit BusIO@^1.14.0
    Links2004/WebSockets@^2.4.0
    bblanchon/ArduinoJson@^7.0.0

# ── Production: data mentah + WS, no serial stats ─────────────────────────────
[env:release]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags = -DDEBUG_LEVEL=0

# ── Production WS: same as release, explicit env for ws build ─────────────────
[env:release-ws]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags = -DDEBUG_LEVEL=0

# ── Debug basic: stats SPS + overflow tiap 1 detik ────────────────────────────
[env:debug]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags = -DDEBUG_LEVEL=1

# ── Debug verbose: label tiap sample + min/max rolling ────────────────────────
[env:debug-verbose]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags = -DDEBUG_LEVEL=2
